name: formulandsocialapp
description: Formuland — F1 Social Media App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # Google Sign-In
  google_sign_in: ^6.2.1

  # File picking and media
  file_picker: ^8.0.0
  share_plus: ^12.0.0

  # UI
  flutter_staggered_grid_view: ^0.7.0

  http: ^1.2.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true